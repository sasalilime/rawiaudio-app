# Contrat de l'API Rawi Audio : source de vérité entre apps/api et apps/web.
# Toute route modifiée dans l'API est d'abord modifiée ici.
openapi: 3.1.0
info:
  title: API Rawi Audio
  version: 0.1.0
servers:
  - url: https://api.rawiaudio.com
  - url: http://localhost:8080
    description: développement local
paths:
  /health:
    get:
      operationId: getHealth
      summary: État de l'API et de sa base de données
      security: [] # accès public, déclaré explicitement
      responses:
        "200":
          description: L'API et Postgres répondent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "503":
          description: Postgres ne répond pas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: unavailable
  /episodes:
    get:
      operationId: listEpisodes
      summary: Épisodes publiés d'une langue, du plus récent au plus ancien
      security: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Lang"
      responses:
        "200":
          description: Les épisodes publiés (liste vide s'il n'y en a aucun).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/Internal"
  /episodes/{id}:
    get:
      operationId: getEpisode
      summary: Un épisode publié, avec son résumé et ses sources
      security: []
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: L'épisode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "404":
          description: Épisode inconnu, ou pas encore publié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "500":
          $ref: "#/components/responses/Internal"
  /episodes/{id}/audio:
    get:
      operationId: getEpisodeAudio
      summary: URL temporaire du fichier audio d'un épisode publié
      description: >
        L'URL pointe directement sur Cloudflare R2 et accepte les requêtes Range.
        Elle expire au bout d'une heure : passé expiresAt, en redemander une (ADR-0003).
      security: [] # public tant que le catalogue est gratuit ; l'abonnement se vérifiera ici
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: L'URL signée et son heure d'expiration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioUrl"
        "404":
          description: Épisode inconnu, ou pas encore publié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "500":
          $ref: "#/components/responses/Internal"
components:
  parameters:
    EpisodeId:
      name: id
      in: path
      required: true
      description: Identifiant public immuable, langue et numéro sur 3 chiffres.
      schema:
        type: string
        example: fr-001
  responses:
    InvalidRequest:
      description: Requête invalide (paramètre absent ou inconnu).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_request
    Internal:
      description: Erreur interne, sans détail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, not_found, internal]
    Lang:
      type: string
      enum: [fr, ar, en]
    SeriesRef:
      type: object
      description: La série (une histoire en plusieurs parties) et la place de l'épisode dans celle-ci.
      additionalProperties: false
      required: [id, title, part]
      properties:
        id:
          type: string
          example: fr-moussa-et-pharaon
        title:
          type: string
        part:
          type: integer
          minimum: 1
          description: Numéro de la partie, les parties s'écoutent dans l'ordre.
    ThemeRef:
      type: object
      additionalProperties: false
      required: [id, title, position]
      properties:
        id:
          type: string
          example: fr-histoires-du-coran
        title:
          type: string
        position:
          type: integer
          minimum: 1
          description: Ordre d'affichage des thèmes dans le catalogue.
    EpisodeSummary:
      type: object
      unevaluatedProperties: false
      required: [id, number, slug, title, reference, durationSeconds, publishedAt, series, themes, imageUrl]
      properties:
        id:
          type: string
          example: fr-001
        number:
          type: integer
          minimum: 1
        slug:
          type: string
          example: les-gens-de-la-caverne
        title:
          type: string
        reference:
          type: string
          description: Référence coranique, affichée telle quelle.
          example: Sourate Al-Kahf, versets 9 à 26
        durationSeconds:
          type: integer
          minimum: 1
        publishedAt:
          type: string
          format: date-time
        series:
          description: La série de l'épisode, ou null s'il n'en a pas.
          anyOf:
            - $ref: "#/components/schemas/SeriesRef"
            - type: "null"
        themes:
          type: array
          description: Les thèmes de l'épisode, dans leur ordre d'affichage ; vide s'il n'en a aucun.
          items:
            $ref: "#/components/schemas/ThemeRef"
        imageUrl:
          description: >-
            Illustration de l'épisode (ADR-0009) : WebP 960 × 540, adresse publique qui ne change jamais
            (l'image se garde en cache). null si l'épisode n'en a pas.
          anyOf:
            - type: string
              format: uri
              example: https://media.rawiaudio.com/fr/001-les-gens-de-la-caverne/image-16x9.webp
            - type: "null"
    Episode:
      allOf:
        - $ref: "#/components/schemas/EpisodeSummary"
        - type: object
          required: [summary, sources]
          properties:
            summary:
              type: array
              description: Paragraphes recopiés de la fiche validée du studio.
              items:
                type: string
            sources:
              type: array
              items:
                $ref: "#/components/schemas/Source"
      unevaluatedProperties: false
    Source:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          description: Livre, tome et page, affichés tels quels.
        url:
          type: string
          description: Lien Shamela uniquement (matrice studio/docs/sources.md).
          pattern: "^https://shamela\\.ws/book/[0-9]+(/[0-9]+)?$"
    AudioUrl:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: URL pré-signée sur le domaine S3 de R2. Ne pas la mettre en cache, elle change à chaque appel.
        expiresAt:
          type: string
          format: date-time
    EpisodeList:
      type: object
      additionalProperties: false
      required: [episodes]
      properties:
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeSummary"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
