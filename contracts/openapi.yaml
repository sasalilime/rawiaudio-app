# Contrat de l'API Rawi Audio : source de vérité entre apps/api et apps/web.
# Toute route modifiée dans l'API est d'abord modifiée ici.
openapi: 3.1.0
info:
  title: API Rawi Audio
  version: 0.4.0
servers:
  - url: https://api.rawiaudio.com
  - url: http://localhost:8080
    description: développement local
paths:
  /health:
    get:
      operationId: getHealth
      summary: État de l'API et de sa base de données
      security: [] # accès public, déclaré explicitement
      responses:
        "200":
          description: L'API et Postgres répondent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "503":
          description: Postgres ne répond pas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: unavailable
  /episodes:
    get:
      operationId: listEpisodes
      summary: Épisodes publiés d'une langue, du plus récent au plus ancien
      security: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Lang"
      responses:
        "200":
          description: Les épisodes publiés (liste vide s'il n'y en a aucun).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/Internal"
  /episodes/{id}:
    get:
      operationId: getEpisode
      summary: Un épisode publié, avec son résumé et ses sources
      security: []
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: L'épisode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "404":
          description: Épisode inconnu, ou pas encore publié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "500":
          $ref: "#/components/responses/Internal"
  /episodes/{id}/audio:
    get:
      operationId: getEpisodeAudio
      summary: URL temporaire du fichier audio d'un épisode publié
      description: >
        L'URL pointe directement sur Cloudflare R2 et accepte les requêtes Range.
        Elle expire au bout d'une heure : passé expiresAt, en redemander une (ADR-0003).
      security: [] # public tant que le catalogue est gratuit ; l'abonnement se vérifiera ici
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: L'URL signée et son heure d'expiration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioUrl"
        "404":
          description: Épisode inconnu, ou pas encore publié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "500":
          $ref: "#/components/responses/Internal"
  # Connexion (ADR-0012) : un e-mail avec un code de 6 chiffres et un lien. S'inscrire = se connecter.
  # Toute requête qui modifie quelque chose passe par http.CrossOriginProtection : 403 si elle vient d'un autre site.
  /auth/login:
    post:
      operationId: requestLogin
      summary: Envoie l'e-mail de connexion (code et lien)
      description: >
        Même réponse pour toute adresse, connue ou non : le compte est créé à la première vérification réussie.
        Une nouvelle demande annule la précédente pour cette adresse. Le code et le lien valent 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "202":
          description: >
            Demande acceptée ; l'e-mail est remis au service d'envoi avant la réponse. client "web" : l'e-mail contient
            aussi un lien, et l'API pose un cookie de preuve sans lequel ce lien est refusé (il ne marche que dans ce
            navigateur). client "app" : un code seulement, ni lien ni cookie.
          headers:
            Set-Cookie:
              description: Seulement pour client "web".
              schema:
                type: string
                example: __Host-rawi_login=…; Path=/; Max-Age=600; HttpOnly; Secure; SameSite=Lax
        "400":
          description: Corps invalide (`invalid_request`) ou adresse e-mail invalide (`invalid_email`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_email
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Plafond quotidien d'envoi d'e-mails atteint ; réessayer plus tard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unavailable
        "500":
          $ref: "#/components/responses/Internal"
  /auth/code:
    post:
      operationId: verifyCode
      summary: Vérifie le code reçu par e-mail et ouvre une session
      description: >
        Crée le compte s'il n'existe pas. client "web" : session dans le cookie (Set-Cookie), sans jeton dans la réponse.
        client "app" : jeton dans la réponse, à envoyer ensuite dans Authorization. 5 essais par demande.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionOpened"
        "400":
          $ref: "#/components/responses/InvalidCode"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /auth/link:
    post:
      operationId: verifyLink
      summary: Vérifie le jeton du lien reçu par e-mail et ouvre une session
      description: >
        Le lien ouvre https://app.rawiaudio.com/connexion#jeton=… ; c'est le bouton « Me connecter » de cette page
        qui appelle cette route, jamais l'ouverture du lien (les antivirus des messageries ouvrent les liens).
        Le navigateur doit envoyer le cookie __Host-rawi_login posé par /auth/login : sans lui, invalid_code. Un lien
        envoyé par quelqu'un d'autre ne connecte donc personne à son compte. Avec un en-tête Origin, client "app"
        est refusé (invalid_request) : un navigateur ne reçoit jamais le jeton dans la réponse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionOpened"
        "400":
          $ref: "#/components/responses/InvalidCode"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /auth/logout:
    post:
      operationId: logout
      summary: Ferme la session de cet appareil
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "204":
          description: Session fermée ; pour la PWA, le cookie est effacé.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /account:
    get:
      operationId: getAccount
      summary: Le compte de la session
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "200":
          description: Le compte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteAccount
      summary: Supprime le compte et toutes ses sessions
      description: Exigé par Apple (règle 5.1.1(v)) et par le RGPD (droit à l'effacement). Irréversible.
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "204":
          description: Compte supprimé ; pour la PWA, le cookie est effacé.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /account/history:
    post:
      operationId: syncHistory
      summary: Synchronise l'historique d'écoute du compte (ADR-0007)
      description: >
        L'appareil envoie tous les épisodes qu'il a entendus et reçoit tout l'historique du compte : il garde l'union.
        Un épisode entendu le reste, rien ne se retire. Un identifiant inconnu, ou d'un épisode pas encore publié, est ignoré.
        Une liste vide lit l'historique sans rien ajouter.
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeardEpisodes"
      responses:
        "200":
          description: Tout l'historique du compte, trié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeardEpisodes"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rawi_session
      description: >
        PWA. Posé par api.rawiaudio.com (HttpOnly, Secure, SameSite=Lax, 180 jours prolongés à l'usage).
        La PWA appelle l'API avec credentials "include" ; le CORS n'accepte les cookies que de https://app.rawiaudio.com.
    bearerToken:
      type: http
      scheme: bearer
      description: App mobile. Jeton renvoyé par /auth/code ou /auth/link avec client "app", gardé dans le trousseau du téléphone.
  parameters:
    EpisodeId:
      name: id
      in: path
      required: true
      description: Identifiant public immuable, langue et numéro sur 3 chiffres.
      schema:
        type: string
        example: fr-001
  responses:
    InvalidRequest:
      description: Requête invalide (paramètre absent ou inconnu).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_request
    Internal:
      description: Erreur interne, sans détail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal
    Unauthorized:
      description: Pas de session, ou session expirée ou fermée.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized
    Forbidden:
      description: Requête venue d'un autre site (protection CSRF).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: forbidden
    TooManyRequests:
      description: Trop de demandes pour cette adresse e-mail ou cette IP.
      headers:
        Retry-After:
          description: Secondes à attendre avant de réessayer.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: too_many_requests
    InvalidCode:
      description: >
        Corps invalide (`invalid_request`), ou code ou jeton refusé (`invalid_code`) : toujours la même réponse,
        que le code soit faux, expiré, déjà utilisé, à court d'essais ou sans demande en cours.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_code
    SessionOpened:
      description: >
        Session ouverte. client "web" : cookie posé par Set-Cookie, pas de jeton. client "app" : jeton dans la réponse.
      headers:
        Set-Cookie:
          description: Seulement pour client "web".
          schema:
            type: string
            example: __Host-rawi_session=…; Path=/; Max-Age=15552000; HttpOnly; Secure; SameSite=Lax
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionOpened"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            [invalid_request, invalid_email, invalid_code, unauthorized, forbidden, not_found, too_many_requests, unavailable, internal]
    Client:
      type: string
      enum: [web, app]
      description: web = la PWA (session en cookie), app = l'app mobile (jeton dans la réponse).
    Email:
      type: string
      format: email
      maxLength: 254
      description: Espaces retirés et mise en minuscules par l'API avant tout usage.
      example: parent@example.com
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, client]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        client:
          $ref: "#/components/schemas/Client"
    CodeRequest:
      type: object
      additionalProperties: false
      required: [email, code, client]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "042917"
        client:
          $ref: "#/components/schemas/Client"
    LinkRequest:
      type: object
      additionalProperties: false
      required: [token, client]
      properties:
        token:
          type: string
          description: Le jeton du lien (32 octets aléatoires en base64url, sans remplissage).
          pattern: "^[A-Za-z0-9_-]{43}$"
        client:
          $ref: "#/components/schemas/Client"
    Account:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    HeardEpisodes:
      type: object
      additionalProperties: false
      required: [episodeIds]
      properties:
        episodeIds:
          type: array
          maxItems: 2000
          items:
            type: string
            pattern: "^(fr|ar|en)-[0-9]{3}$"
            example: fr-001
    SessionOpened:
      type: object
      additionalProperties: false
      required: [account]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        token:
          type: string
          description: Seulement pour client "app" ; à envoyer dans Authorization (Bearer). Jamais renvoyé à la PWA.
          pattern: "^[A-Za-z0-9_-]{43}$"
    Lang:
      type: string
      enum: [fr, ar, en]
    SeriesRef:
      type: object
      description: La série (une histoire en plusieurs parties) et la place de l'épisode dans celle-ci.
      additionalProperties: false
      required: [id, title, part]
      properties:
        id:
          type: string
          example: fr-moussa-et-pharaon
        title:
          type: string
        part:
          type: integer
          minimum: 1
          description: Numéro de la partie, les parties s'écoutent dans l'ordre.
    ThemeRef:
      type: object
      additionalProperties: false
      required: [id, title, position]
      properties:
        id:
          type: string
          example: fr-histoires-du-coran
        title:
          type: string
        position:
          type: integer
          minimum: 1
          description: Ordre d'affichage des thèmes dans le catalogue.
    EpisodeSummary:
      type: object
      unevaluatedProperties: false
      required: [id, number, slug, title, reference, durationSeconds, publishedAt, series, themes, imageUrl]
      properties:
        id:
          type: string
          example: fr-001
        number:
          type: integer
          minimum: 1
        slug:
          type: string
          example: les-gens-de-la-caverne
        title:
          type: string
        reference:
          type: string
          description: Référence coranique, affichée telle quelle.
          example: Sourate Al-Kahf, versets 9 à 26
        durationSeconds:
          type: integer
          minimum: 1
        publishedAt:
          type: string
          format: date-time
        series:
          description: La série de l'épisode, ou null s'il n'en a pas.
          anyOf:
            - $ref: "#/components/schemas/SeriesRef"
            - type: "null"
        themes:
          type: array
          description: Les thèmes de l'épisode, dans leur ordre d'affichage ; vide s'il n'en a aucun.
          items:
            $ref: "#/components/schemas/ThemeRef"
        imageUrl:
          description: >-
            Illustration de l'épisode (ADR-0009) : WebP 960 × 540, adresse publique qui ne change jamais
            (l'image se garde en cache). null si l'épisode n'en a pas.
          anyOf:
            - type: string
              format: uri
              example: https://media.rawiaudio.com/fr/001-les-gens-de-la-caverne/image-16x9-3f9a1c.webp
            - type: "null"
    Episode:
      allOf:
        - $ref: "#/components/schemas/EpisodeSummary"
        - type: object
          required: [summary, sources]
          properties:
            summary:
              type: array
              description: Paragraphes recopiés de la fiche validée du studio.
              items:
                type: string
            sources:
              type: array
              items:
                $ref: "#/components/schemas/Source"
      unevaluatedProperties: false
    Source:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          description: Livre, tome et page, affichés tels quels.
        url:
          type: string
          description: Lien Shamela uniquement (matrice studio/docs/sources.md).
          pattern: "^https://shamela\\.ws/book/[0-9]+(/[0-9]+)?$"
    AudioUrl:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: URL pré-signée sur le domaine S3 de R2. Ne pas la mettre en cache, elle change à chaque appel.
        expiresAt:
          type: string
          format: date-time
    EpisodeList:
      type: object
      additionalProperties: false
      required: [episodes]
      properties:
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeSummary"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
