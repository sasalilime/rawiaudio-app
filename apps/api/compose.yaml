# Environnement de développement local. La stack de prod est décrite dans ops/.
# Démarrage : cp .env.example .env, puis docker compose up -d
name: rawi-dev

services:
  db:
    # Debian (glibc) et non Alpine (musl) : musl trie mal les accents, et changer
    # d'image plus tard oblige à reconstruire les index texte.
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: rawi
      POSTGRES_DB: rawi
      # Lu uniquement à la création du volume : le changer ensuite ne change rien.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans apps/api/.env}
    ports:
      - "127.0.0.1:5432:5432" # joignable depuis la machine seulement (go run, tests)
    volumes:
      - db-data:/var/lib/postgresql # chemin des images postgres 18 et plus
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rawi", "-d", "rawi"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      # Dans le réseau de Compose, la base s'appelle db et non localhost :
      # l'URL est donc construite ici, pas reprise du DATABASE_URL de .env.
      DATABASE_URL: postgres://rawi:${POSTGRES_PASSWORD:?à définir dans apps/api/.env}@db:5432/rawi?sslmode=disable
      R2_ENDPOINT: ${R2_ENDPOINT:?à définir dans apps/api/.env}
      R2_BUCKET: ${R2_BUCKET:?à définir dans apps/api/.env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?à définir dans apps/api/.env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?à définir dans apps/api/.env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy # l'API migre au démarrage : la base doit répondre

volumes:
  db-data:
