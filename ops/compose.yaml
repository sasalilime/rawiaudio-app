# Stack de production de Rawi sur le VPS (ADR-0005). Depuis ops/ :
#   cp .env.example .env   (puis remplir)
#   docker compose up -d --build --wait
# Caddy (socle du VPS, hors de ce repo) relaie https://api.rawiaudio.com vers 127.0.0.1:8100.
name: rawi

# Rotation des logs : sans elle, les journaux des conteneurs finissent par remplir le disque du VPS.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Même image que le dev (apps/api/compose.yaml) : Debian, pour le tri du français.
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_USER: rawi
      POSTGRES_DB: rawi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans ops/.env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rawi", "-d", "rawi"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: *logging
    # Aucun port publié : seule l'API y accède, par le réseau propre à la stack.

  api:
    build: ../apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rawi:${POSTGRES_PASSWORD:?à définir dans ops/.env}@db:5432/rawi?sslmode=disable
      R2_ENDPOINT: ${R2_ENDPOINT:?à définir dans ops/.env}
      R2_BUCKET: ${R2_BUCKET:?à définir dans ops/.env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?à définir dans ops/.env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?à définir dans ops/.env}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?à définir dans ops/.env}
    ports:
      - "127.0.0.1:8100:8080" # joignable par Caddy seulement, jamais depuis Internet
    depends_on:
      db:
        condition: service_healthy # l'API migre au démarrage
    mem_limit: 128m
    # L'API n'écrit rien sur le disque : système de fichiers en lecture seule, aucun privilège.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  db-data:
